<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Kontrol Penugasan Publikasi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Navbar -->
  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-700 rounded-lg">
          <i class="fa-solid me-0 fa-clipboard-list text-xl text-indigo-200"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Kontrol Penugasan Publikasi</h1>
          <p class="text-xs text-indigo-300">Sistem Managemen Brief & Brief Strategis</p>
        </div>
      </div>
      <button onclick="loadData()" class="flex items-center gap-2 bg-indigo-700 hover:bg-indigo-600 px-3 py-1.5 rounded-lg text-sm transition">
        <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> Refresh Data
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

    <!-- Ringkasan Statistik -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="glass-card p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Total Pengajuan</p>
          <h3 id="stat-total" class="text-2xl font-bold text-slate-800">0</h3>
        </div>
        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg"><i class="fa-solid fa-inbox text-xl"></i></div>
      </div>
      <div class="glass-card p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Dalam Proses</p>
          <h3 id="stat-progress" class="text-2xl font-bold text-amber-600">0</h3>
        </div>
        <div class="p-3 bg-amber-50 text-amber-600 rounded-lg"><i class="fa-solid fa-spinner text-xl"></i></div>
      </div>
      <div class="glass-card p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Selesai (Done)</p>
          <h3 id="stat-done" class="text-2xl font-bold text-emerald-600">0</h3>
        </div>
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><i class="fa-solid fa-circle-check text-xl"></i></div>
      </div>
      <div class="glass-card p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Logistik Mandiri</p>
          <h3 id="stat-logistik" class="text-2xl font-bold text-purple-600">0</h3>
        </div>
        <div class="p-3 bg-purple-50 text-purple-600 rounded-lg"><i class="fa-solid fa-camera text-xl"></i></div>
      </div>
    </div>

    <!-- Filter & Filter Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="search-input" onkeyup="filterData()" placeholder="Cari kegiatan, PIC, atau unit..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <select id="filter-unit" onchange="filterData()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Semua Unit</option>
          <option value="TK">TK</option>
          <option value="SD">SD</option>
          <option value="SMP">SMP</option>
          <option value="SMA">SMA</option>
          <option value="General">General / Humas</option>
        </select>

        <select id="filter-status" onchange="filterData()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Semua Status</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="text-center py-12">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600 mb-3"></i>
      <p class="text-slate-500 font-medium">Memuat data respon dari Spreadsheet...</p>
    </div>

    <!-- Container Kartu Penugasan -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

    <!-- Empty State -->
    <div id="empty-state" class="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300 hidden">
      <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-2"></i>
      <p class="text-slate-500">Tidak ada pengajuan yang sesuai dengan filter.</p>
    </div>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transition-opacity duration-300 opacity-0 pointer-events-none z-50">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
    <span id="toast-msg" class="text-sm">Berhasil disimpan!</span>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_xCKxRuEXBsyCtx_yAp9lYIwiUUUW8_UNIkXgBs0f9qeQXZ-n77xete6RpIxNVwYZ/exec";
    let allData = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadData();
    });

    async function loadData() {
      const loading = document.getElementById("loading");
      const cardsContainer = document.getElementById("cards-container");
      const emptyState = document.getElementById("empty-state");
      const refreshIcon = document.getElementById("refresh-icon");

      refreshIcon.classList.add("fa-spin");
      loading.classList.remove("hidden");
      cardsContainer.classList.add("hidden");
      emptyState.classList.add("hidden");

      try {
        const response = await fetch(SCRIPT_URL);
        allData = await response.json();
        updateStats();
        renderCards(allData);
      } catch (err) {
        showToast("Gagal memuat data dari Spreadsheet", false);
        console.error(err);
      } finally {
        loading.classList.add("hidden");
        refreshIcon.classList.remove("fa-spin");
      }
    }

    function updateStats() {
      document.getElementById("stat-total").innerText = allData.length;
      document.getElementById("stat-progress").innerText = allData.filter(d => d.status === "In Progress" || !d.status).length;
      document.getElementById("stat-done").innerText = allData.filter(d => d.status === "Done").length;
      document.getElementById("stat-logistik").innerText = allData.filter(d => d.jenisKerja.indexOf("Logistik") !== -1).length;
    }

    function renderCards(data) {
      const cardsContainer = document.getElementById("cards-container");
      const emptyState = document.getElementById("empty-state");

      if (data.length === 0) {
        cardsContainer.classList.add("hidden");
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      cardsContainer.classList.remove("hidden");

      cardsContainer.innerHTML = data.map(item => {
        const isDone = item.status === "Done";
        const badgeColor = isDone ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700";
        const isLogistik = item.jenisKerja.indexOf("Logistik") !== -1;

        return `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
            <div class="p-5">
              <!-- Top Info Header -->
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="px-2.5 py-1 bg-slate-100 text-slate-700 text-xs font-semibold rounded-md uppercase">
                  ${escapeHtml(item.unit)}
                </span>
                <span class="text-xs text-slate-400 font-medium">
                  <i class="fa-regular fa-calendar me-1"></i>${escapeHtml(item.tglFormatted)}
                </span>
              </div>

              <!-- Judul Kegiatan -->
              <h4 class="font-bold text-slate-800 text-base mb-2 leading-snug">
                ${escapeHtml(item.kegiatan)}
              </h4>

              <!-- Jenis Pekerjaan Tag -->
              <div class="mb-3">
                <span class="inline-block text-xs font-medium px-2 py-0.5 rounded ${isLogistik ? 'bg-purple-100 text-purple-700' : 'bg-indigo-50 text-indigo-600'}">
                  ${escapeHtml(item.jenisKerja)}
                </span>
              </div>

              <!-- Detail Brief -->
              <p class="text-xs text-slate-600 line-clamp-3 mb-4 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                ${escapeHtml(item.detail)}
              </p>

              <!-- Informational Extra for Logistik -->
              ${isLogistik ? `
                <div class="text-xs bg-purple-50 p-2 rounded-lg text-purple-800 mb-4 border border-purple-100">
                  <p class="font-semibold"><i class="fa-solid fa-box me-1"></i>${escapeHtml(item.alat)}</p>
                </div>
              ` : ''}

              <!-- PIC & Contact -->
              <div class="text-xs text-slate-500 mb-4 flex items-center justify-between border-t pt-3">
                <span><i class="fa-regular fa-user me-1"></i> ${escapeHtml(item.pic)}</span>
              </div>

              <!-- Form Assignment -->
              <div class="space-y-3 pt-2 border-t border-slate-100">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Petugas Tim:</label>
                  <input type="text" id="petugas-${item.rowId}" value="${escapeHtml(item.petugas.join(', '))}" placeholder="Sebutkan nama petugas (pisahkan koma)" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Status Pengerjaan:</label>
                  <select id="status-${item.rowId}" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="In Progress" ${!isDone ? 'selected' : ''}>In Progress</option>
                    <option value="Done" ${isDone ? 'selected' : ''}>Done</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Card Footer -->
            <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex items-center justify-between">
              <span class="text-xs px-2 py-0.5 rounded-full font-medium ${badgeColor}">
                ${item.status || 'In Progress'}
              </span>
              <button onclick="saveAssignment(${item.rowId})" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                <i class="fa-solid fa-floppy-disk"></i> Simpan
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterData() {
      const searchVal = document.getElementById("search-input").value.toLowerCase();
      const unitVal = document.getElementById("filter-unit").value;
      const statusVal = document.getElementById("filter-status").value;

      const filtered = allData.filter(item => {
        const matchSearch = item.kegiatan.toLowerCase().includes(searchVal) ||
                            item.pic.toLowerCase().includes(searchVal) ||
                            item.unit.toLowerCase().includes(searchVal) ||
                            item.detail.toLowerCase().includes(searchVal);
        const matchUnit = !unitVal || item.unit === unitVal;
        const matchStatus = !statusVal || item.status === statusVal || (!item.status && statusVal === "In Progress");

        return matchSearch && matchUnit && matchStatus;
      });

      renderCards(filtered);
    }

    async function saveAssignment(rowId) {
      const petugasVal = document.getElementById(`petugas-${rowId}`).value;
      const statusVal = document.getElementById(`status-${rowId}`).value;

      const petugasArray = petugasVal.split(',').map(s => s.trim()).filter(Boolean);

      const payload = {
        rowId: rowId,
        petugasList: petugasArray,
        status: statusVal
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // Update local state
        const idx = allData.findIndex(d => d.rowId === rowId);
        if (idx !== -1) {
          allData[idx].petugas = petugasArray;
          allData[idx].status = statusVal;
        }

        updateStats();
        filterData();
        showToast("Penugasan & status berhasil disimpan!");
      } catch (err) {
        showToast("Gagal menyimpan data", false);
        console.error(err);
      }
    }

    function showToast(msg, isSuccess = true) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toast-msg");
      const toastIcon = document.getElementById("toast-icon");

      toastMsg.innerText = msg;
      toastIcon.className = isSuccess ? "fa-solid fa-circle-check text-emerald-400 text-lg" : "fa-solid fa-triangle-exclamation text-rose-400 text-lg";

      toast.classList.remove("opacity-0", "pointer-events-none");
      setTimeout(() => {
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
