<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontrol Penugasan Publikasi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

  <!-- Header / Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600 rounded-lg text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white leading-tight">KONTROL PENUGASAN PUBLIKASI</h1>
          <p class="text-xs text-slate-400">Sistem Manajemen Brief & Brief Strategis</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openMendadakModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-lg text-sm flex items-center gap-1.5 transition">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1a1 1 0 10-2 0v1a1 1 0 102 0zM12 14a2 2 0 100-4 2 2 0 000 4z"/></svg>
          + Order Mendadak
        </button>
        <button onclick="copyRekapWA()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center gap-1.5 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
          Copy Rekap Grup WA
        </button>
        <button onclick="loadData()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-lg transition" title="Refresh Data">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">

    <!-- Filter & Search Bar -->
    <div class="bg-slate-800/80 backdrop-blur rounded-xl p-4 border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Periode:</label>
        <select id="periodeSelect" onchange="renderData()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm font-semibold text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <!-- Populated by JS -->
        </select>
      </div>
      <div class="relative w-full sm:w-72">
        <input type="text" id="searchInput" oninput="renderData()" placeholder="Cari kegiatan, PIC, unit..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
    </div>

    <!-- Grid: Chart & Distribusi Tugas -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Sebaran Order Per Unit (Left) -->
      <div class="lg:col-span-5 bg-slate-800/80 rounded-xl p-5 border border-slate-700 flex flex-col justify-between">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path></svg>
          Sebaran Order Per Unit
        </h2>
        <div class="relative flex items-center justify-center min-h-[200px]">
          <canvas id="unitChart"></canvas>
        </div>
      </div>

      <!-- Distribusi Tugas Personel (Right) -->
      <div class="lg:col-span-7 bg-slate-800/80 rounded-xl p-5 border border-slate-700">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          Distribusi Tugas Personel
        </h2>
        <div id="personelSummaryGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Daftar Order Masuk -->
    <div class="bg-slate-800/80 rounded-xl border border-slate-700 overflow-hidden">
      <div class="p-4 border-b border-slate-700 flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
          Daftar Order Masuk
        </h2>
        <span id="orderCountBadge" class="bg-indigo-900/60 text-indigo-300 text-xs font-semibold px-2.5 py-1 rounded-full border border-indigo-700">0 Order</span>
      </div>

      <div id="orderListContainer" class="p-4 space-y-4">
        <!-- Cards Populated by JS -->
      </div>
    </div>

  </main>

  <!-- MODAL: KUNCI KEAMANAN KASIE -->
  <div id="pinModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto border border-amber-500/20">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      <div>
        <h3 class="text-base font-bold text-white uppercase tracking-wider">Kunci Keamanan Kasie</h3>
        <p class="text-xs text-slate-400 mt-1">Masukkan PIN rahasia untuk mengubah penugasan:</p>
      </div>
      <input type="password" id="pinInput" placeholder="••••••••" class="w-full text-center tracking-widest text-lg bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <div class="flex gap-3 pt-2">
        <button onclick="closePinModal()" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium py-2.5 rounded-xl transition">Batal</button>
        <button onclick="submitPin()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2.5 rounded-xl shadow-lg transition">OK</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none z-50">
    <span id="toastMsg" class="text-sm"></span>
  </div>

  <!-- JavaScript Logic -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_xCKxRuEXBsyCtx_yAp91YIwiUUUW8_UNIkXgbS0f9qeQXZ-n77xete6RpIxNVwYZ/exec";
    const KASIE_PIN = "yesi123";
    const TEAM_MEMBERS = ["Magang", "Dodai", "Nia", "Wahyu", "Yesi", "Indri"];
    const INDO_MONTHS = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

    let allData = [];
    let pendingAction = null;
    let unitChartInstance = null;
    let isUnlocked = false;

    document.addEventListener("DOMContentLoaded", () => {
      initPeriodeDropdown();
      loadData();
    });

    function initPeriodeDropdown() {
      const select = document.getElementById("periodeSelect");
      select.innerHTML = "";
      
      // Default generate 12 bulan untuk tahun 2026
      INDO_MONTHS.forEach(m => {
        const opt = document.createElement("option");
        opt.value = `${m} 2026`;
        opt.textContent = `${m} 2026`;
        select.appendChild(opt);
      });
      select.value = "Agustus 2026";
    }

    async function loadData() {
      showToast("Memuat data...");
      try {
        const res = await fetch(SCRIPT_URL);
        allData = await res.json();
        renderData();
        showToast("Data berhasil diperbarui!");
      } catch (err) {
        console.error("Gagal memuat data:", err);
        showToast("Gagal mengambil data!", true);
      }
    }

    function parseTglDanWaktu(rawStr) {
      if (!rawStr) return { dateObj: null, timeStr: "07:00 AM", bulanTahun: "", tglFormatted: "-" };

      const str = String(rawStr).trim();
      const monthMap = {
        'jan': 0, 'januari': 0, 'january': 0,
        'feb': 1, 'februari': 1, 'february': 1,
        'mar': 2, 'maret': 2, 'march': 2,
        'apr': 3, 'april': 3,
        'mei': 4, 'may': 4,
        'jun': 5, 'juni': 5, 'june': 5,
        'jul': 6, 'juli': 6, 'july': 6,
        'agu': 7, 'agustus': 7, 'aug': 7, 'august': 7,
        'sep': 8, 'september': 8,
        'okt': 9, 'oktober': 9, 'oct': 9, 'october': 9,
        'nov': 10, 'november': 10,
        'des': 11, 'desember': 11, 'dec': 11, 'december': 11
      };

      let day = null, monthIdx = null, year = null;

      // Match format teks: "19 Agustus 2026, Pk 07.00"
      const mText = str.match(/(\d{1,2})[\s\-\/\.]+([a-zA-Z]+)[\s\-\/\.]+(\d{4})/);
      if (mText) {
        day = parseInt(mText[1], 10);
        const mStr = mText[2].toLowerCase();
        year = parseInt(mText[3], 10);
        if (monthMap[mStr] !== undefined) monthIdx = monthMap[mStr];
      }

      // Match format numerik: ISO "2026-08-19" atau "19/08/2026"
      if (monthIdx === null) {
        const mIso = str.match(/(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
        if (mIso) {
          year = parseInt(mIso[1], 10);
          monthIdx = parseInt(mIso[2], 10) - 1;
          day = parseInt(mIso[3], 10);
        } else {
          const mNum = str.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);
          if (mNum) {
            day = parseInt(mNum[1], 10);
            monthIdx = parseInt(mNum[2], 10) - 1;
            year = parseInt(mNum[3], 10);
          }
        }
      }

      // Format Jam
      let timeStr = "08:00 AM";
      const mTime = str.match(/(?:pk\.?|jam)?\s*(\d{1,2})[\:\.](\d{2})/i);
      if (mTime) {
        let hh = parseInt(mTime[1], 10);
        const mm = mTime[2];
        const ampm = hh >= 12 ? "PM" : "AM";
        if (hh > 12) hh -= 12;
        if (hh === 0) hh = 12;
        timeStr = `${String(hh).padStart(2, '0')}:${mm} ${ampm}`;
      }

      if (monthIdx !== null && monthIdx >= 0 && monthIdx <= 11 && year) {
        const bulanTahun = `${INDO_MONTHS[monthIdx]} ${year}`;
        const tglFormatted = day ? `${day} ${INDO_MONTHS[monthIdx]} ${year}` : bulanTahun;
        return { timeStr, bulanTahun, tglFormatted };
      }

      return { timeStr, bulanTahun: "", tglFormatted: str };
    }

    function renderData() {
      const activePeriode = document.getElementById("periodeSelect").value;
      const searchKeyword = document.getElementById("searchInput").value.toLowerCase().trim();

      const filtered = allData.filter(item => {
        const parsed = parseTglDanWaktu(item.rawTglWaktu);
        const matchPeriode = parsed.bulanTahun === activePeriode || (!parsed.bulanTahun && activePeriode === "Agustus 2026");
        
        const matchSearch = !searchKeyword || 
          item.kegiatan.toLowerCase().includes(searchKeyword) ||
          item.pic.toLowerCase().includes(searchKeyword) ||
          item.unit.toLowerCase().includes(searchKeyword);

        return matchPeriode && matchSearch;
      });

      renderChart(filtered);
      renderPersonelSummary(filtered);
      renderOrderList(filtered);
    }

    function renderPersonelSummary(filteredData) {
      const summaryGrid = document.getElementById("personelSummaryGrid");
      summaryGrid.innerHTML = "";

      TEAM_MEMBERS.forEach(member => {
        let total = 0, done = 0, progress = 0;

        filteredData.forEach(item => {
          if (item.petugas && item.petugas.includes(member)) {
            total++;
            if (item.status === "Selesai") done++;
            else progress++;
          }
        });

        summaryGrid.innerHTML += `
          <div class="bg-slate-900/60 border border-slate-700/70 rounded-xl p-3 flex flex-col justify-between">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-200 uppercase">${member}</span>
              <span class="text-xs font-semibold text-slate-400">${total} TUGAS</span>
            </div>
            <div class="flex items-center gap-3 mt-2 text-xs font-semibold">
              <span class="text-emerald-400 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                ${done}
              </span>
              <span class="text-amber-400 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                ${progress}
              </span>
            </div>
          </div>
        `;
      });
    }

    function renderChart(filteredData) {
      const unitCounts = {};
      filteredData.forEach(item => {
        const u = item.unit || "Lainnya";
        unitCounts[u] = (unitCounts[u] || 0) + 1;
      });

      const labels = Object.keys(unitCounts);
      const dataValues = Object.values(unitCounts);

      const ctx = document.getElementById("unitChart").getContext("2d");
      if (unitChartInstance) unitChartInstance.destroy();

      if (labels.length === 0) {
        return;
      }

      unitChartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#6366f1']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 } } }
          }
        }
      });
    }

    function renderOrderList(filteredData) {
      const container = document.getElementById("orderListContainer");
      document.getElementById("orderCountBadge").textContent = `${filteredData.length} Order`;
      container.innerHTML = "";

      if (filteredData.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <svg class="w-12 h-12 mx-auto mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
            Tidak ada data penugasan pada periode ini.
          </div>
        `;
        return;
      }

      filteredData.forEach(item => {
        const parsed = parseTglDanWaktu(item.rawTglWaktu);

        const memberButtons = TEAM_MEMBERS.map(member => {
          const isSelected = item.petugas && item.petugas.includes(member);
          return `
            <button 
              onclick="requestPetugasToggle(${item.rowId}, '${member}')"
              class="px-2.5 py-1 rounded-md text-xs font-medium transition ${
                isSelected 
                  ? 'bg-indigo-600 text-white font-bold shadow' 
                  : 'bg-slate-700/60 text-slate-300 hover:bg-slate-600'
              }">
              ${member}
            </button>
          `;
        }).join("");

        container.innerHTML += `
          <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-4 space-y-3">
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              
              <!-- Tanggal & Judul -->
              <div class="space-y-1">
                <div class="flex items-center gap-2 text-xs font-semibold text-indigo-400">
                  <span>${parsed.tglFormatted}</span>
                  <span>•</span>
                  <span>${parsed.timeStr}</span>
                  <span class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700 ml-1">${item.unit}</span>
                </div>
                <h3 class="text-base font-bold text-white">${item.kegiatan}</h3>
                <p class="text-xs text-slate-400">PIC: ${item.pic}</p>
              </div>

              <!-- Action Status -->
              <div>
                <select 
                  onchange="requestStatusChange(${item.rowId}, this.value)"
                  class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-semibold ${item.status === 'Selesai' ? 'text-emerald-400 border-emerald-800' : 'text-amber-400 border-amber-800'} focus:outline-none">
                  <option value="In Progress" ${item.status !== 'Selesai' ? 'selected' : ''}>⌛ In Progress</option>
                  <option value="Selesai" ${item.status === 'Selesai' ? 'selected' : ''}>✅ Selesai</option>
                </select>
              </div>
            </div>

            <!-- Detail Tugas -->
            <div class="bg-slate-950/40 p-3 rounded-lg border border-slate-800 text-xs space-y-1">
              <p class="text-slate-300"><span class="font-bold text-slate-400">Penjelasan Tugas:</span> ${item.detail}</p>
              <p class="text-slate-400"><span class="font-bold text-slate-500">Kategori:</span> ${item.kategori}</p>
            </div>

            <!-- Pilih Personel -->
            <div class="pt-1 flex flex-wrap items-center justify-between gap-2 border-t border-slate-800">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Pilih Personel:</span>
              <div class="flex flex-wrap gap-1.5">
                ${memberButtons}
              </div>
            </div>
          </div>
        `;
      });
    }

    /* Guard System PIN */
    function requestPetugasToggle(rowId, namaPersonel) {
      executeWithPin(() => togglePetugas(rowId, namaPersonel));
    }

    function requestStatusChange(rowId, newStatus) {
      executeWithPin(() => updateStatus(rowId, newStatus));
    }

    function executeWithPin(actionFn) {
      if (isUnlocked) {
        actionFn();
      } else {
        pendingAction = actionFn;
        document.getElementById("pinModal").classList.remove("hidden");
        document.getElementById("pinInput").focus();
      }
    }

    function submitPin() {
      const input = document.getElementById("pinInput").value.trim().toLowerCase();
      if (input === KASIE_PIN.toLowerCase()) {
        isUnlocked = true;
        closePinModal();
        if (pendingAction) {
          pendingAction();
          pendingAction = null;
        }
        showToast("Akses Kasie Diberikan!");
      } else {
        showToast("PIN Rahasia Salah!", true);
      }
    }

    function closePinModal() {
      document.getElementById("pinModal").classList.add("hidden");
      document.getElementById("pinInput").value = "";
    }

    async function togglePetugas(rowId, namaPersonel) {
      const item = allData.find(d => d.rowId === rowId);
      if (!item) return;

      if (!item.petugas) item.petugas = [];
      const idx = item.petugas.indexOf(namaPersonel);
      if (idx > -1) item.petugas.splice(idx, 1);
      else item.petugas.push(namaPersonel);

      renderData();

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rowId: rowId, petugas: item.petugas })
        });
        showToast("Petugas berhasil diperbarui!");
      } catch (err) {
        showToast("Gagal menyimpan ke Google Sheets", true);
      }
    }

    async function updateStatus(rowId, newStatus) {
      const item = allData.find(d => d.rowId === rowId);
      if (!item) return;

      item.status = newStatus;
      renderData();

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rowId: rowId, status: newStatus })
        });
        showToast("Status berhasil diperbarui!");
      } catch (err) {
        showToast("Gagal menyimpan ke Google Sheets", true);
      }
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.textContent = msg;
      
      toast.className = `fixed bottom-5 right-5 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 z-50 ${
        isError ? 'bg-rose-900 border border-rose-700 text-rose-100' : 'bg-slate-800 border border-slate-700 text-white'
      }`;
      
      toast.classList.remove("opacity-0", "pointer-events-none");
      setTimeout(() => toast.classList.add("opacity-0", "pointer-events-none"), 3000);
    }

    function copyRekapWA() {
      const activePeriode = document.getElementById("periodeSelect").value;
      const filtered = allData.filter(item => parseTglDanWaktu(item.rawTglWaktu).bulanTahun === activePeriode);

      let text = `*REKAP PENUGASAN PUBLIKASI - ${activePeriode.toUpperCase()}*\n\n`;
      filtered.forEach((item, i) => {
        const p = parseTglDanWaktu(item.rawTglWaktu);
        const petugas = item.petugas && item.petugas.length ? item.petugas.join(", ") : "-";
        text += `${i + 1}. *${item.kegiatan}* (${item.unit})\n`;
        text += `   📅 ${p.tglFormatted} | ⏰ ${p.timeStr}\n`;
        text += `   👤 Petugas: ${petugas}\n`;
        text += `   📌 Status: ${item.status}\n\n`;
      });

      navigator.clipboard.writeText(text);
      showToast("Rekap WA berhasil disalin!");
    }
  </script>
</body>
</html>
