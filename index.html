<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KONTROL PENUGASAN PUBLIKASI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans p-4 md:p-6">

  <!-- HEADER -->
  <div class="max-w-7xl mx-auto space-y-6">
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[#151c2c] p-4 rounded-xl border border-slate-800 shadow-lg">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2.5 rounded-lg">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-wide uppercase">Kontrol Penugasan Publikasi</h1>
          <p class="text-xs text-slate-400">Sistem Manajemen Brief & Brief Strategis</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button onclick="openModalOrder()" class="bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          + Order Mendadak
        </button>
        <button onclick="copyRekapWA()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
          Copy Rekap Grup WA
        </button>
        <button onclick="loadData()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-lg transition" title="Refresh Data">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </div>
    </header>

    <!-- FILTER BAR -->
    <div class="bg-[#151c2c] p-4 rounded-xl border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full md:w-auto">
        <label class="text-xs font-bold text-slate-400 tracking-wider">PERIODE:</label>
        <select id="filterPeriode" onchange="applyFilters()" class="bg-[#0b0f19] border border-slate-700 text-white text-sm rounded-lg p-2 font-semibold focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="Agustus 2026">Agustus 2026</option>
          <option value="September 2026">September 2026</option>
          <option value="Oktober 2026">Oktober 2026</option>
          <option value="Semua">Semua Periode</option>
        </select>
      </div>

      <div class="relative w-full md:w-80">
        <svg class="w-4 h-4 absolute left-3 top-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Cari kegiatan, PIC, unit..." class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
    </div>

    <!-- TOP SECTION: CHART & DISTRIBUSI TUGAS -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- CHART SEBARAN ORDER -->
      <div class="bg-[#151c2c] p-5 rounded-xl border border-slate-800 flex flex-col">
        <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-4 flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 0120.945 13H11V3.055z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
          Sebaran Order Per Unit
        </h2>
        <div class="flex-1 flex items-center justify-center min-h-[220px]">
          <canvas id="chartUnit"></canvas>
        </div>
      </div>

      <!-- DISTRIBUSI TUGAS PERSONEL -->
      <div class="bg-[#151c2c] p-5 rounded-xl border border-slate-800">
        <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-4 flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          Distribusi Tugas Personel
        </h2>
        <div id="personelGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <!-- Rendered dynamically -->
        </div>
      </div>

    </div>

    <!-- BOTTOM SECTION: DAFTAR ORDER MASUK -->
    <div class="bg-[#151c2c] p-5 rounded-xl border border-slate-800 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
          Daftar Order Masuk
        </h2>
        <span id="orderBadgeCount" class="bg-indigo-900/50 text-indigo-300 text-xs font-bold px-3 py-1 rounded-full border border-indigo-700/50">0 Order</span>
      </div>

      <div id="orderContainer" class="space-y-4">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- MODAL ORDER MENDADAK -->
  <div id="modalOrderMendadak" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4">
    <div class="bg-[#151c2c] border border-slate-800 rounded-xl w-full max-w-lg p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-amber-500 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          + Tambah Order Mendadak
        </h3>
        <button onclick="closeModalOrder()" class="text-slate-400 hover:text-white">&times;</button>
      </div>

      <form id="formOrderMendadak" onsubmit="handleOrderMendadakSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Unit / Divisi</label>
          <select id="inputUnit" required class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            <option value="SMA">SMA</option>
            <option value="SMP">SMP</option>
            <option value="KB-TK">KB-TK</option>
            <option value="Yayasan">Yayasan</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nama PIC & No. Kontak</label>
          <input type="text" id="inputPIC" required placeholder="Contoh: Leonardus - 082113866890" class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Kegiatan / Judul Brief</label>
          <input type="text" id="inputKegiatan" required placeholder="Contoh: Publikasi Penerimaan Siswa Baru" class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Kategori</label>
          <input type="text" id="inputKategori" placeholder="A. Informasi Kegiatan Kalender Akademik" class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Penjelasan / Detail Tugas</label>
          <textarea id="inputDetail" rows="3" placeholder="Detail instruksi order mendadak..." class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" onclick="closeModalOrder()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-lg transition">Batal</button>
          <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold rounded-lg transition">Simpan Order</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 hidden z-50 bg-slate-800 text-white px-4 py-3 rounded-xl border border-slate-700 shadow-2xl text-sm font-medium transition-all"></div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // GANTI DEPLOYMENT URL GOOGLE APPS SCRIPT ANDA DI SINI:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEJIqtNYNEKJ2My8aApMeO4NzCy23oH8H1n3F1_tuYo_6yf8iToUWIrJ87JPqzQYJQ/exec";
    
    const APP_PIN = "yesi123"; // PIN Akses Petugas

    const ALL_PERSONEL = ["MAGANG", "DODAI", "NIA", "WAHYU", "YESI", "INDRI"];
    let rawData = [];
    let filteredData = [];
    let chartInstance = null;
    let isAuthenticated = false;

    // PIN Authentication Check
    function checkAuth() {
      if (isAuthenticated) return true;
      const input = prompt("Masukkan PIN Otentikasi Petugas:");
      if (input === APP_PIN) {
        isAuthenticated = true;
        return true;
      } else {
        showToast("PIN Salah! Akses ditolak.", true);
        return false;
      }
    }

    // Load Data
    async function loadData() {
      showToast("Memuat data...");
      try {
        const res = await fetch(SCRIPT_URL);
        if (!res.ok) throw new Error(`HTTP Status ${res.status}`);
        
        const rawText = await res.text();
        if (rawText.trim().startsWith("<")) {
          throw new Error("Izin Google Apps Script belum diset ke 'Anyone'.");
        }

        rawData = JSON.parse(rawText);
        applyFilters();
        showToast("Data berhasil diperbarui!");
      } catch (err) {
        console.error(err);
        showToast("Gagal mengambil data! " + err.message, true);
      }
    }

    // Filter Logic
    function applyFilters() {
      const periode = document.getElementById("filterPeriode").value;
      const query = document.getElementById("searchInput").value.toLowerCase();

      filteredData = rawData.filter(item => {
        const matchQuery = (item.kegiatan || "").toLowerCase().includes(query) ||
                           (item.pic || "").toLowerCase().includes(query) ||
                           (item.unit || "").toLowerCase().includes(query);
        
        // Simple period filter logic (or default show all if 'Semua')
        const matchPeriode = periode === "Semua" || (item.rawTglWaktu || "").includes("2026");
        return matchQuery && matchPeriode;
      });

      renderChart();
      renderPersonelStats();
      renderOrders();
    }

    // Render Chart
    function renderChart() {
      const ctx = document.getElementById('chartUnit').getContext('2d');
      const counts = {};

      filteredData.forEach(item => {
        const u = item.unit || "Lainnya";
        counts[u] = (counts[u] || 0) + 1;
      });

      const labels = Object.keys(counts);
      const dataValues = Object.values(counts);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels.length ? labels : ["Tidak Ada Data"],
          datasets: [{
            data: dataValues.length ? dataValues : [1],
            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#64748b'],
            borderWidth: 2,
            borderColor: '#151c2c'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 } } }
          }
        }
      });
    }

    // Render Personel Stats
    function renderPersonelStats() {
      const grid = document.getElementById("personelGrid");
      grid.innerHTML = "";

      ALL_PERSONEL.forEach(pName => {
        let total = 0;
        let done = 0;
        let inProgress = 0;

        filteredData.forEach(item => {
          if (Array.isArray(item.petugas) && item.petugas.includes(pName)) {
            total++;
            if (item.status === "Done") done++;
            else inProgress++;
          }
        });

        grid.innerHTML += `
          <div class="bg-[#0b0f19] p-3 rounded-lg border border-slate-800 flex flex-col justify-between">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs font-bold text-slate-200">${pName}</span>
              <span class="text-[10px] bg-slate-800 text-slate-400 font-bold px-1.5 py-0.5 rounded">${total} TUGAS</span>
            </div>
            <div class="flex items-center gap-3 text-xs font-semibold">
              <span class="text-emerald-400 flex items-center gap-1">✓ ${done}</span>
              <span class="text-amber-400 flex items-center gap-1">⏱ ${inProgress}</span>
            </div>
          </div>
        `;
      });
    }

    // Render Order Cards
    function renderOrders() {
      const container = document.getElementById("orderContainer");
      document.getElementById("orderBadgeCount").innerText = `${filteredData.length} Order`;
      container.innerHTML = "";

      if (filteredData.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Tidak ada data order ditemukan.</div>`;
        return;
      }

      filteredData.forEach(item => {
        const assignedList = Array.isArray(item.petugas) ? item.petugas : [];

        const personelButtons = ALL_PERSONEL.map(pName => {
          const isSelected = assignedList.includes(pName);
          const activeClass = isSelected ? "bg-indigo-600 text-white border-indigo-500 font-bold" : "bg-slate-800/60 text-slate-400 border-slate-700 hover:bg-slate-700";
          return `
            <button onclick="togglePersonel(${item.rowId}, '${pName}')" class="px-3 py-1 rounded text-xs border transition ${activeClass}">
              ${pName}
            </button>
          `;
        }).join("");

        container.innerHTML += `
          <div class="bg-[#0b0f19] border border-slate-800 rounded-xl p-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-2">
              <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-indigo-400">${item.rawTglWaktu || '-'}</span>
                <span class="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-700">${item.unit}</span>
              </div>
              <select onchange="updateStatus(${item.rowId}, this.value)" class="bg-[#151c2c] border border-slate-700 text-amber-400 text-xs font-bold rounded-lg px-2 py-1 outline-none">
                <option value="In Progress" ${item.status === "In Progress" ? "selected" : ""}>⏳ In Progress</option>
                <option value="Done" ${item.status === "Done" ? "selected" : ""}>✅ Done</option>
                <option value="Pending" ${item.status === "Pending" ? "selected" : ""}>⏸ Pending</option>
              </select>
            </div>

            <div>
              <h3 class="text-sm font-bold text-slate-100">${item.kegiatan}</h3>
              <p class="text-xs text-slate-400">PIC: ${item.pic}</p>
            </div>

            <div class="bg-[#151c2c] p-3 rounded-lg border border-slate-800 text-xs text-slate-300 space-y-1">
              <p><span class="text-slate-400 font-semibold">Penjelasan Tugas:</span> ${item.detail}</p>
              <p><span class="text-slate-400 font-semibold">Kategori:</span> ${item.kategori}</p>
            </div>

            <div>
              <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Pilih Personel:</label>
              <div class="flex flex-wrap gap-1.5">
                ${personelButtons}
              </div>
            </div>
          </div>
        `;
      });
    }

    // Toggle Personel
    async function togglePersonel(rowId, personName) {
      if (!checkAuth()) return;

      const item = rawData.find(d => d.rowId === rowId);
      if (!item) return;

      let currentPetugas = Array.isArray(item.petugas) ? [...item.petugas] : [];
      if (currentPetugas.includes(personName)) {
        currentPetugas = currentPetugas.filter(p => p !== personName);
      } else {
        currentPetugas.push(personName);
      }

      showToast("Memperbarui personel...");
      item.petugas = currentPetugas;
      renderPersonelStats();
      renderOrders();

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ rowId: rowId, petugas: currentPetugas })
        });
        const result = await res.json();
        if (result.status === "success") {
          showToast("Personel berhasil diperbarui!");
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        showToast("Gagal update personel: " + err.message, true);
        loadData();
      }
    }

    // Update Status
    async function updateStatus(rowId, newStatus) {
      if (!checkAuth()) return;

      showToast("Memperbarui status...");
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ rowId: rowId, status: newStatus })
        });
        const result = await res.json();
        if (result.status === "success") {
          showToast("Status berhasil diperbarui!");
          const item = rawData.find(d => d.rowId === rowId);
          if (item) item.status = newStatus;
          applyFilters();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        showToast("Gagal update status: " + err.message, true);
        loadData();
      }
    }

    // Modal Order Mendadak Handlers
    function openModalOrder() {
      document.getElementById("modalOrderMendadak").style.display = "flex";
    }

    function closeModalOrder() {
      document.getElementById("modalOrderMendadak").style.display = "none";
      document.getElementById("formOrderMendadak").reset();
    }

    async function handleOrderMendadakSubmit(e) {
      e.preventDefault();
      
      const payload = {
        action: "addOrder",
        unit: document.getElementById("inputUnit").value,
        pic: document.getElementById("inputPIC").value,
        kegiatan: document.getElementById("inputKegiatan").value,
        kategori: document.getElementById("inputKategori").value,
        detail: document.getElementById("inputDetail").value,
        petugas: []
      };

      showToast("Menyimpan order mendadak...");
      closeModalOrder();

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        
        const result = await res.json();
        if (result.status === "success") {
          showToast("Order mendadak berhasil dibuat!");
          loadData();
        } else {
          throw new Error(result.message || "Gagal menyimpan");
        }
      } catch (err) {
        console.error(err);
        showToast("Gagal membuat order: " + err.message, true);
      }
    }

    // Copy Rekap WhatsApp
    function copyRekapWA() {
      if (!filteredData.length) {
        showToast("Tidak ada data untuk direkap!", true);
        return;
      }

      let text = `*REKAP KONTROL PENUGASAN PUBLIKASI*\nPeriode: ${document.getElementById("filterPeriode").value}\n-----------------------------------\n\n`;

      filteredData.forEach((item, idx) => {
        const petugasStr = Array.isArray(item.petugas) && item.petugas.length ? item.petugas.join(", ") : "Belum Ada";
        text += `${idx + 1}. *[${item.unit}] ${item.kegiatan}*\n`;
        text += `   • PIC: ${item.pic}\n`;
        text += `   • Status: ${item.status}\n`;
        text += `   • Petugas: ${petugasStr}\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast("Rekap WA berhasil dicopy!");
      }).catch(err => {
        showToast("Gagal menyalin rekap", true);
      });
    }

    // Helper Toast
    function showToast(msg, isError = false) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl border shadow-2xl text-sm font-medium transition-all ${
        isError ? "bg-rose-900 border-rose-700 text-rose-200" : "bg-slate-800 border-slate-700 text-slate-100"
      }`;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 3000);
    }

    // Inisialisasi awal
    window.onload = loadData;
  </script>
</body>
</html>
